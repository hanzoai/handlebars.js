# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
    # spec/mustache is a submodule (the shared mustache conformance corpus) and
    # spec/spec.js reads it at load time. Without it that suite dies on ENOENT
    # while the other 18 files pass — a build that omits part of its own source
    # and still looks almost green. The reusable does not fetch submodules by
    # default, so the repo that has one says so.
    with:
      submodules: recursive
